<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — SR Estética e Bem Estar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9B1226">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#9B1226; --rose-d:#6E0A1A; --rose-l:#F8E4E7;
  --gold:#C9A227; --gold-l:#E7D3A1;
  --ink:#2B2225; --ink-2:#4A3D40; --muted:#8A787C;
  --bg:#FBF7F5; --card:#FFFFFF; --line:#EFE1E2; --ok:#2E7D5B;
  --safe:constant(safe-area-inset-bottom,0px);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;padding-bottom:calc(28px + var(--safe))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-appearance:none;appearance:none}
input{font:inherit;-webkit-appearance:none;appearance:none}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-cx{width:100%;max-width:340px;text-align:center}
.login img{width:170px;margin:0 auto 22px;display:block}
.login h1{font-family:"Cormorant Garamond",serif;font-size:26px;margin:0 0 6px;font-weight:600}
.login p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.login input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:13px 14px;font-size:16px;text-align:center;outline:0;margin-bottom:10px}
.login input:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-l)}
.login button{width:100%;border-radius:12px;padding:13px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(140deg,var(--rose),var(--rose-d));box-shadow:0 6px 18px rgba(155,18,38,.28)}
.erro{color:#B3453D;font-size:13px;margin-top:12px;min-height:18px}

/* ---------- topo ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topo{display:flex;align-items:center;gap:12px;padding:12px 0}
.topo img{height:34px;width:auto}
.topo .t{flex:1;min-width:0}
.topo b{display:block;font-size:14.5px;font-weight:600;line-height:1.2}
.topo span{font-size:11.5px;color:var(--muted)}
.sair{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}

.data-linha{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.data-linha label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.data-linha input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:15px}

/* ---------- cartões ---------- */
h2{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;margin:26px 0 12px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:700;
  color:var(--rose-d);line-height:1.1;margin-top:6px}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- listas ---------- */
.bloco{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.hora{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:700;color:var(--rose-d);
  min-width:58px;line-height:1.1}
.item .c{flex:1;min-width:0}
.item .c b{display:block;font-size:14.5px;font-weight:600}
.item .c span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.item .v{font-size:14px;font-weight:600;white-space:nowrap}
.tel{color:var(--rose-d);text-decoration:none;font-size:12.5px}

.vazio{text-align:center;color:var(--muted);font-size:13.5px;padding:22px 0}

.slots{display:flex;flex-wrap:wrap;gap:7px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink-2)}
.slot.ocupado{background:#F6EFEE;color:#B99;border-style:dashed;text-decoration:line-through;font-weight:400}
.legenda{font-size:12px;color:var(--muted);margin-top:10px}

.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{width:22px;font-size:12px;color:var(--muted);font-weight:700}
.rank .b{flex:1;min-width:0}
.rank .b b{display:block;font-size:13.8px;font-weight:600}
.barra{height:6px;border-radius:99px;background:var(--rose-l);margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-d))}
.rank .q{font-size:12.5px;color:var(--muted);white-space:nowrap}

.aviso{background:#FFF6E6;border:1px solid var(--gold-l);color:#9A6414;border-radius:12px;
  padding:10px 12px;font-size:12.5px;margin-top:14px}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:26px 0 0}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login" id="telaLogin">
  <div class="login-cx">
    <img src="logo.png" alt="SR Estética e Bem Estar">
    <h1>Painel da clínica</h1>
    <p>Acesso restrito</p>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" inputmode="text">
    <button id="btnEntrar">Entrar</button>
    <div class="erro" id="erroLogin"></div>
  </div>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="telaPainel" hidden>
  <header>
    <div class="wrap topo">
      <img src="logo.png" alt="">
      <div class="t"><b>Painel da clínica</b><span id="subtitulo">carregando…</span></div>
      <button class="sair" id="btnSair">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div class="data-linha">
      <label for="dia">Dia</label>
      <input type="date" id="dia">
    </div>

    <div class="kpis" id="kpis"></div>

    <h2>Atendimentos do dia</h2>
    <div class="bloco" id="agenda"></div>

    <h2>Horários disponíveis</h2>
    <div class="bloco" style="padding:14px">
      <div class="slots" id="slots"></div>
      <div class="legenda">Riscado = já ocupado. Considera 30 em 30 minutos, dentro do horário de funcionamento.</div>
    </div>

    <h2>Serviços mais realizados <small style="font-size:13px;color:var(--muted);font-weight:400">no mês</small></h2>
    <div class="bloco" id="ranking"></div>

    <div class="aviso" id="avisoDados"></div>
    <footer>SR Estética e Bem Estar · dados dos agendamentos feitos pelo site</footer>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
/* com separador de milhar: faturamento passa de mil e "R$ 6420,00" lê mal */
const money = (n) => "R$ " + (Number(n) || 0).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const dur = (m) => { const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? h + "h" + String(r).padStart(2, "0") : h + "h") : r + "min"; };

/* Horário de funcionamento — precisa bater com o do site */
const HORARIOS = {0:null, 1:["09:00","18:00"], 2:["09:00","18:00"], 3:["09:00","18:00"],
                  4:["09:00","18:00"], 5:["09:00","18:00"], 6:["09:00","16:00"]};
const PASSO = 30;
const hm = (s) => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const mh = (m) => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");

function hojeSP(){ return new Date().toLocaleDateString("sv-SE", {timeZone:"America/Sao_Paulo"}); }

let SENHA = sessionStorage.getItem("painel_senha") || "";

/* ---------------- login ---------------- */
async function entrar(senha){
  const r = await fetch(`/api/relatorio?senha=${encodeURIComponent(senha)}`, {cache:"no-store"});
  if(r.status === 401) throw new Error("Senha incorreta.");
  if(r.status === 503) throw new Error("O painel ainda não foi configurado no servidor (falta a senha).");
  if(!r.ok) throw new Error("Não consegui falar com o servidor. Tente de novo.");
  return r.json();
}

$("#btnEntrar").onclick = async () => {
  const s = $("#senha").value.trim();
  $("#erroLogin").textContent = "";
  if(!s){ $("#senha").focus(); return; }
  try{
    await entrar(s);
    SENHA = s;
    try{ sessionStorage.setItem("painel_senha", s); }catch(e){}
    abrirPainel();
  }catch(e){ $("#erroLogin").textContent = e.message; }
};
$("#senha").addEventListener("keydown", (e) => { if(e.key === "Enter") $("#btnEntrar").click(); });

$("#btnSair").onclick = () => {
  try{ sessionStorage.removeItem("painel_senha"); }catch(e){}
  location.reload();
};

/* ---------------- painel ---------------- */
function abrirPainel(){
  $("#telaLogin").hidden = true;
  $("#telaPainel").hidden = false;
  if(!$("#dia").value) $("#dia").value = hojeSP();
  carregar();
}
$("#dia").addEventListener("change", carregar);

async function carregar(){
  const dia = $("#dia").value || hojeSP();
  const mes = dia.slice(0,7);
  $("#subtitulo").textContent = "carregando…";
  try{
    const r = await fetch(`/api/relatorio?senha=${encodeURIComponent(SENHA)}&dia=${dia}&mes=${mes}`, {cache:"no-store"});
    if(!r.ok) throw new Error("erro " + r.status);
    desenhar(await r.json(), dia);
  }catch(e){
    $("#subtitulo").textContent = "falha ao carregar";
    $("#agenda").innerHTML = `<div class="vazio">Não consegui carregar os dados.<br>${e.message}</div>`;
  }
}

function desenhar(d, dia){
  const t = d.totais;
  const [a,m,dd] = dia.split("-");
  $("#subtitulo").textContent = `${dd}/${m}/${a} · mês de ${m}/${a}`;

  $("#kpis").innerHTML = `
    <div class="kpi"><span>Atendimentos hoje</span><b>${t.atendimentosDia}</b><small>${money(t.faturamentoDia)} no dia</small></div>
    <div class="kpi"><span>Clientes no mês</span><b>${t.clientesMes}</b><small>${t.atendimentosMes} atendimentos</small></div>
    <div class="kpi"><span>Faturamento do mês</span><b style="font-size:24px">${money(t.faturamentoMes)}</b><small>ticket ${money(t.ticketMedioMes)}</small></div>
    <div class="kpi"><span>Livres hoje</span><b id="kpiLivres">—</b><small>horários de 30 min</small></div>`;

  const ag = d.atendimentosDoDia;
  $("#agenda").innerHTML = ag.length ? ag.map((a) => `
    <div class="item">
      <div class="hora">${a.hora}</div>
      <div class="c">
        <b>${a.cliente || "sem nome"}</b>
        <span>${a.servicos.join(" · ")}</span>
        <span>${dur(a.minutos)}${a.telefone ? ` · <a class="tel" href="https://wa.me/55${a.telefone}">WhatsApp</a>` : ""}</span>
      </div>
      <div class="v">${money(a.total)}</div>
    </div>`).join("") : `<div class="vazio">Nenhum agendamento para este dia.</div>`;

  /* horários livres = grade do dia menos o que já está ocupado */
  const dt = new Date(dia + "T12:00:00");
  const exp = HORARIOS[dt.getDay()];
  const slots = $("#slots");
  if(!exp){
    slots.innerHTML = `<div class="vazio" style="width:100%">Fechado neste dia.</div>`;
    const k = $("#kpiLivres"); if(k) k.textContent = "0";
  } else {
    const ocupado = new Set();
    ag.forEach((a) => {
      const ini = hm(a.hora), fim = ini + Math.max(Number(a.minutos) || PASSO, PASSO);
      for(let x = Math.floor(ini/PASSO)*PASSO; x < fim; x += PASSO) ocupado.add(x);
    });
    let livres = 0, html = "";
    for(let x = hm(exp[0]); x + PASSO <= hm(exp[1]); x += PASSO){
      const oc = ocupado.has(x);
      if(!oc) livres++;
      html += `<span class="slot${oc ? " ocupado" : ""}">${mh(x)}</span>`;
    }
    slots.innerHTML = html;
    const k = $("#kpiLivres"); if(k) k.textContent = livres;
  }

  const rk = d.ranking;
  const topo = rk.length ? rk[0].vezes : 1;
  $("#ranking").innerHTML = rk.length ? rk.map((s,i) => `
    <div class="rank">
      <div class="n">${i+1}º</div>
      <div class="b"><b>${s.nome}</b><div class="barra"><i style="width:${Math.round(s.vezes/topo*100)}%"></i></div></div>
      <div class="q">${s.vezes}× · ${money(s.receita)}</div>
    </div>`).join("") : `<div class="vazio">Nenhum atendimento registrado neste mês ainda.</div>`;

  $("#avisoDados").textContent = t.atendimentosMes === 0
    ? "Ainda não há agendamentos gravados. O painel se preenche sozinho conforme as clientes agendam pelo site — agendamentos combinados direto no WhatsApp não aparecem aqui."
    : "Aparecem aqui apenas os agendamentos feitos pelo site. Os combinados direto no WhatsApp não são contabilizados.";
}

/* já logado nesta sessão? entra direto */
if(SENHA){
  entrar(SENHA).then(abrirPainel).catch(() => { SENHA = ""; try{ sessionStorage.removeItem("painel_senha"); }catch(e){} });
}
</script>
</body>
</html>
